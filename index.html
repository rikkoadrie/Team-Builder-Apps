<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Legacy Makers – Team Builder Hub</title>

<meta name="apple-mobile-web-app-capable" content="yes">

      type="image/png"
      sizes="512x512"
      href="team-builder-icon-512.png">

<link rel="apple-touch-icon"

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f5f1;
  color:#29251f;
}

.container{
  max-width:620px;
  margin:auto;
  padding:0 18px 35px;
}

/* =========================
   HEADER
========================= */

.hero{
  text-align:center;
  padding:34px 10px 28px;
}

.brand{
  font-size:13px;
  letter-spacing:5px;
  font-weight:700;
  color:#62594d;
  margin-bottom:14px;
}

.hero h1{
  font-size:30px;
  line-height:1.1;
  margin:0;
  letter-spacing:-1px;
}

.tagline{
  margin:12px auto 0;
  max-width:430px;
  font-size:14px;
  line-height:1.5;
  color:#777067;
  font-style:italic;
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:24px;
}

.section:first-of-type{
  margin-top:4px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin:0 5px 12px;
}

.section-title{
  font-size:15px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}

.section-subtitle{
  font-size:11px;
  color:#999187;
}

/* =========================
   CARDS
========================= */

.apps{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.card{
  display:flex;
  align-items:center;

  background:#fff;

  border:1px solid #ebe5dc;
  border-radius:18px;

  padding:16px;

  color:inherit;
  text-decoration:none;

  box-shadow:0 3px 12px rgba(0,0,0,.035);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.card:active{
  transform:scale(.985);
}

/* =========================
   ICON
========================= */

.icon{
  width:48px;
  height:48px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-right:14px;

  border-radius:14px;

  background:#f1e9da;

  font-size:22px;
}

/* =========================
   TEXT
========================= */

.card-content{
  flex:1;
  min-width:0;
}

.card-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:4px;
}

.card-desc{
  font-size:12.5px;
  color:#8a847b;
  line-height:1.4;
}

.arrow{
  margin-left:10px;
  font-size:23px;
  color:#aaa29a;
}

/* =========================
   LEADER CARD
========================= */

.leader-card{
  border:1px solid #ddd0b8;
  background:#fffdf8;
}

.leader-card .icon{
  background:#eadbbd;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  margin-top:34px;

  color:#aaa39a;

  font-size:10px;
  line-height:1.7;

  letter-spacing:.4px;
}

.footer strong{
  color:#81786b;
}

/* =========================
   MOBILE
========================= */

  .container{
    padding-left:14px;
    padding-right:14px;
  }

  .hero
